<!doctype html>
<html lang="en">
  <body style="margin:0;padding:24px;background:#f6f3ee;font-family:Arial,Helvetica,sans-serif;color:#1d2a33">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;margin:0 auto;background:#ffffff;border-radius:12px">
      <tr>
        <td style="padding:32px">
          <h1 style="margin:0 0 16px;font-size:22px">Reset your password</h1>
          <p style="margin:0 0 24px;font-size:16px;line-height:24px">
            We received a request to reset the password for your Islands VA account.
          </p>
          <p style="margin:0 0 24px">
            <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery"
               style="display:inline-block;padding:12px 20px;border-radius:8px;background:#1d2a33;color:#ffffff;text-decoration:none;font-weight:bold">
              Choose a new password
            </a>
          </p>
          <p style="margin:0;font-size:14px;line-height:20px;color:#5b6770">
            This link works once and expires in 24 hours. If you didn't ask for it, ignore this email — your password stays the same.
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
